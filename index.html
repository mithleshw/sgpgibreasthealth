<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pink Wave 2026 — Are you breast aware? | क्या आप स्तन जागरूक हैं?</title>
<meta name="description" content="Pink Wave 2026 — SGPGI Breast Health Program. Myth or Fact, Spot the Sign, and the 7-step self-examination. Early detection saves lives.">
<meta name="theme-color" content="#e91e8c">
<meta property="og:title" content="Are you breast aware? — Pink Wave 2026">
<meta property="og:description" content="Six minutes. Three games. Everything from the SGPGI Breast Health Program's own guide. #JoinTheWave">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --pink:#e91e8c; --pinkd:#b3126b; --pinkl:#ff7ec0;
  --ink:#2a1b25; --muted:#7c6c76; --line:#f2cde1;
  --ok:#17825a; --okbg:#e7f7ef; --no:#c2384a; --nobg:#fdeef0;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;
  color:var(--ink);
  background:linear-gradient(175deg,#fff6fb 0%,#ffe9f4 45%,#ffdcee 100%);
  background-attachment:fixed;
  min-height:100dvh;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 40px;position:relative}

/* ---------- bar ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 0;
  background:linear-gradient(180deg,rgba(255,246,251,.97) 55%,rgba(255,246,251,0));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14.5px;color:var(--pinkd);cursor:pointer}
.brand svg{width:20px;height:20px}
.sp{flex:1}
.iconbtn{border:1.5px solid var(--line);background:#fff;color:var(--pinkd);font:inherit;font-weight:800;
  font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
.lang{display:flex;border:1.5px solid var(--pink);border-radius:99px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--pink);padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--pink);color:#fff}

/* ---------- progress ---------- */
.steps{display:flex;gap:5px;margin:2px 0 14px}
.steps[hidden],[hidden]{display:none!important}
.steps i{flex:1;height:5px;border-radius:99px;background:#ffd2e8;display:block;overflow:hidden}
.steps i b{display:block;height:100%;width:0;background:var(--pink);transition:width .4s ease}

/* ---------- generic ---------- */
.screen{display:none;animation:in .3s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:27px;line-height:1.15;margin:0 0 8px}
h2{font-size:20px;line-height:1.25;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{line-height:1.6;margin:0 0 12px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.6}
.card{background:#fff;border-radius:var(--r);border:1px solid rgba(233,30,140,.09);
  box-shadow:0 6px 22px rgba(200,40,120,.09)}
.pad{padding:18px}
.mt{margin-top:16px}.mt8{margin-top:9px}
.center{text-align:center}

.btn{display:block;width:100%;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:16px;
  padding:15px 16px;cursor:pointer;text-align:center;text-decoration:none;
  background:linear-gradient(135deg,var(--pink),var(--pinkd));color:#fff;box-shadow:0 6px 18px rgba(233,30,140,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--pinkd);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:14.5px;padding:12px 14px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- splash ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:28px 22px 24px;
  background:linear-gradient(150deg,#ff92cb,#e91e8c 52%,#87084f);box-shadow:0 14px 36px rgba(180,20,105,.3)}
.hero .wv{position:absolute;inset:auto -5% -25% -5%;height:60%;opacity:.25}
.hero .kick{font-size:11px;letter-spacing:2.6px;font-weight:800;opacity:.92;margin-bottom:8px}
.hero h1{font-size:33px;font-weight:900;letter-spacing:-.4px;margin:0 0 8px}
.hero p{font-size:14.5px;opacity:.96;margin:0 0 16px}
.hero .who{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36);
  padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700}
.gamerow{display:grid;gap:10px;margin-top:16px}
.grow{display:flex;gap:13px;align-items:center;padding:14px;border-radius:15px;background:#fff;
  border:1px solid rgba(233,30,140,.1);box-shadow:0 4px 14px rgba(200,40,120,.07)}
.grow .n{flex:0 0 34px;height:34px;border-radius:99px;background:linear-gradient(140deg,#ffd9ec,#ff9ed0);
  display:grid;place-items:center;font-weight:900;color:var(--pinkd);font-size:15px}
.grow b{display:block;font-size:15px}
.grow span{font-size:12.5px;color:var(--muted)}

/* ---------- quiz ---------- */
.qcard{position:relative;min-height:220px;padding:26px 22px;display:flex;align-items:center;
  border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(200,40,120,.14);
  border:1px solid rgba(233,30,140,.1);touch-action:pan-y;user-select:none}
.qcard .qt{font-size:20px;line-height:1.42;font-weight:700}
.stamp{position:absolute;top:14px;right:16px;font-weight:900;font-size:14px;letter-spacing:1px;
  border:3px solid currentColor;border-radius:9px;padding:3px 9px;transform:rotate(9deg);opacity:0;transition:opacity .15s}
.stamp.m{color:var(--no)}.stamp.f{color:var(--ok)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
.ans button{border:0;border-radius:15px;padding:15px 8px;font:inherit;font-weight:800;font-size:16px;
  cursor:pointer;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.ans .m{background:linear-gradient(135deg,#ef5f78,#c2384a)}
.ans .f{background:linear-gradient(135deg,#3cba86,#17825a)}
.ans small{display:block;font-weight:600;font-size:11px;opacity:.9;margin-top:1px}
.reveal{margin-top:13px;padding:16px;border-radius:16px;display:none}
.reveal.on{display:block;animation:in .25s ease}
.reveal.r{background:var(--okbg);border:1px solid #bfe8d5}
.reveal.w{background:var(--nobg);border:1px solid #f6ccd3}
.reveal .v{font-weight:900;font-size:14.5px;margin-bottom:6px}
.reveal p{margin:0;font-size:14.5px}

/* ---------- signs ---------- */
.signart{position:relative;background:#fff;border-radius:18px;border:1px solid var(--line);padding:8px;
  box-shadow:0 6px 20px rgba(200,40,120,.09)}
.signart svg{width:100%;height:auto;display:block;cursor:crosshair}
.pulse{animation:pl 1.1s ease infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- trainer ---------- */
.photo{border-radius:14px;overflow:hidden;background:#f9ecf3;border:1px solid var(--line)}
.photo img{width:100%;height:auto;display:block}
.chip{display:inline-block;background:var(--pink);color:#fff;font-size:11.5px;font-weight:800;
  letter-spacing:.8px;padding:5px 12px;border-radius:99px;margin-bottom:10px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:99px;background:#ffc9e3;display:block;transition:width .3s}
.dots i.on{background:var(--pink);width:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.patgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.pat{border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px;cursor:pointer;font:inherit}
.pat.on{border-color:var(--pink);box-shadow:0 0 0 3px rgba(233,30,140,.12)}
.pat img{width:100%;border-radius:9px;display:block}
.pat span{display:block;font-size:11.5px;font-weight:800;margin-top:6px;color:var(--pinkd)}

/* ---------- misc ---------- */
.alert{background:#fff5e8;border:1px solid #ffd9a8;border-radius:14px;padding:14px;font-size:14px;line-height:1.6}
.big{font-size:56px;font-weight:900;line-height:1;color:var(--pinkd)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.sc b{display:block;font-size:20px;color:var(--pinkd)}
.sc span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px}
input,select{width:100%;padding:14px 15px;border-radius:13px;border:2px solid var(--line);
  font:inherit;font-size:16px;background:#fff;color:var(--ink);margin-bottom:10px}
input:focus,select:focus{outline:0;border-color:var(--pink)}
label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
#pcanvas{width:100%;height:auto;border-radius:16px;box-shadow:0 10px 28px rgba(200,40,120,.22);display:block}
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;padding:12px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);align-items:center}
.row .k{font-size:11px;letter-spacing:.9px;font-weight:800;color:var(--pink);min-width:86px}
.row .v{font-size:14px;font-weight:600}
.vid{display:flex;gap:10px;align-items:center;padding:8px;border-radius:13px;background:#fff;
  border:1px solid var(--line);cursor:pointer;width:100%;font:inherit;text-align:left;margin-bottom:8px}
.vid img{width:76px;height:43px;object-fit:cover;border-radius:8px;flex:0 0 76px;background:#eee}
.vid b{font-size:13px;font-weight:700;line-height:1.35}
.vidchip{display:inline-flex;gap:7px;align-items:center;background:#fff;border:1.5px solid var(--line);
  border-radius:99px;padding:6px 13px 6px 7px;font-size:12.5px;font-weight:800;color:var(--pinkd);
  cursor:pointer;margin-top:11px;font-family:inherit}
.vidchip i{width:20px;height:20px;border-radius:99px;background:var(--pink);display:grid;place-items:center;
  color:#fff;font-style:normal;font-size:9px}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(40,10,28,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:#fff;width:100%;max-width:540px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px;
  max-height:86dvh;overflow:auto}
.foot{margin-top:24px;text-align:center;font-size:11px;color:var(--muted);line-height:1.8}
.disc{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.65;text-align:center;padding:0 4px}
.docbar{margin-top:16px;display:flex;gap:9px;align-items:center;padding:12px 14px;border-radius:14px;
  background:#fff;border:1px solid var(--line);cursor:pointer;width:100%;font:inherit;text-align:left}
.docbar b{font-size:13.5px;color:var(--pinkd)}

/* ---------- SGPGI mark + student artwork ---------- */
.brand .mark{width:30px;height:29px;display:block;border-radius:6px}
.hero .herologo{width:66px;height:64px;display:block;margin:0 0 12px;
  background:#fff;border-radius:50%;padding:4px;box-shadow:0 4px 14px rgba(90,0,50,.28)}
.arthead{font-size:15px;color:var(--pinkd);margin:22px 0 2px;letter-spacing:.2px}
.artrail{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 6px;margin:0 -16px;
  padding-left:16px;padding-right:16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.artrail::-webkit-scrollbar{display:none}
.artcard{flex:0 0 172px;scroll-snap-align:start;background:#fff;border-radius:16px;
  border:1px solid var(--line);padding:9px;box-shadow:0 5px 16px rgba(200,40,120,.09)}
.artcard img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:11px;display:block;
  background:#fff7fb}
.artcard span{display:block;font-size:12px;font-weight:700;color:var(--pinkd);
  line-height:1.4;margin-top:8px}
.artcredit{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

/* ---------- awareness pledge checkbox ---------- */
.pledgebox{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin:14px 0 2px;
  padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fffafd;
  transition:border-color .18s, background .18s}
.pledgebox input{position:absolute;opacity:0;width:0;height:0;margin:0}
.pledgebox .tick{flex:0 0 24px;height:24px;border-radius:7px;border:2.5px solid var(--pink);
  background:#fff;position:relative;transition:background .18s, transform .12s}
.pledgebox .tick::after{content:"";position:absolute;left:7px;top:2.5px;width:6px;height:12px;
  border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);
  transition:transform .18s cubic-bezier(.2,1.6,.5,1)}
.pledgebox input:checked ~ .tick{background:var(--pink)}
.pledgebox input:checked ~ .tick::after{transform:rotate(45deg) scale(1)}
.pledgebox input:focus-visible ~ .tick{box-shadow:0 0 0 4px rgba(233,30,140,.22)}
.pledgebox:has(input:checked){border-color:var(--pink);background:#fff2f8}
.pledgebox .ptxt{font-size:13.5px;font-weight:700;line-height:1.5;color:var(--ink)}
.pthanks{font-size:12.5px;font-weight:700;color:var(--ok);margin:7px 2px 0;animation:in .25s ease}

/* ---------- source attribution (every screen) ---------- */
.srcbox{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:12px 13px;
  border-radius:14px;background:rgba(255,255,255,.72);border:1px solid var(--line);
  font-size:11.5px;line-height:1.6;color:var(--muted)}
.srcbox img{width:34px;height:33px;flex:0 0 34px;border-radius:7px}
.srcbox a{color:var(--pinkd);text-decoration:none}
.srcbox b{color:var(--pinkd)}
.srclink{display:block;margin-top:5px;font-weight:800;color:var(--pink)}

/* ---------- interaction layer ---------- */
.btn,.ans button,.grow,.docbar,.pat,.vid,.row{position:relative;overflow:hidden;
  transition:transform .13s ease, box-shadow .13s ease}
.btn:active,.ans button:active,.docbar:active,.vid:active{transform:scale(.975)}
.grow:active,.pat:active{transform:scale(.97)}
.ripple{position:absolute;width:12px;height:12px;border-radius:99px;pointer-events:none;
  background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);
  animation:rip .6s ease-out forwards}
.btn.ghost .ripple,.grow .ripple,.docbar .ripple,.pat .ripple,.vid .ripple{background:rgba(233,30,140,.28)}
@keyframes rip{to{transform:translate(-50%,-50%) scale(26);opacity:0}}

.petals{position:fixed;inset:0;pointer-events:none;z-index:120}
.petals i{position:absolute;border-radius:99px;opacity:.95;
  animation:pet 1.25s cubic-bezier(.2,.7,.35,1) forwards}
@keyframes pet{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 190px))
       scale(1) rotate(var(--rot));opacity:0}}

.shakeNo{animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

.streak{text-align:center;font-size:13px;font-weight:800;color:var(--pinkd);
  min-height:19px;margin-top:9px;letter-spacing:.3px}

.qcard{transition:transform .25s ease, opacity .25s ease}
.steps i b{box-shadow:0 0 8px rgba(233,30,140,.5)}
.big{transition:transform .2s ease}

.maprow{text-decoration:none;color:inherit;display:flex}
.mapcta{font-size:12px;font-weight:800;color:var(--pink);display:inline-block;margin-top:3px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body data-screen="splash">
<div class="wrap">

  <div class="bar">
    <button class="iconbtn" id="backBtn" hidden>‹</button>
    <div class="brand" id="home">
      <img src="img/logo.png" srcset="img/logo.png 1x, img/logo@2x.png 2x"
           alt="SGPGI Breast Health Program" class="mark">
      <span>PINK WAVE 2026</span>
    </div>
    <div class="sp"></div>
    <button class="iconbtn" id="menuBtn">☰</button>
    <div class="lang"><button id="bEn" class="on">EN</button><button id="bHi">हिं</button></div>
  </div>

  <div class="steps" id="prog" hidden><i><b></b></i><i><b></b></i><i><b></b></i></div>

  <!-- SPLASH -->
  <section class="screen on" id="s-splash">
    <div class="hero">
      <svg class="wv" viewBox="0 0 400 120" preserveAspectRatio="none">
        <path d="M0,60 C80,10 140,110 220,60 C300,10 350,90 400,55 L400,120 L0,120 Z" fill="#fff"/>
        <path d="M0,80 C90,40 150,120 230,80 C310,40 360,100 400,75 L400,120 L0,120 Z" fill="#fff" opacity=".45"/>

      <h1 data-t="tagline"></h1>

      <span class="who" data-t="hostedBy"></span>
    </div>
    <div class="gamerow">
      <div class="grow"><span class="n">1</span><span><b data-t="m1Title"></b><span data-t="m1Sub"></span></span></div>
      <div class="grow"><span class="n">2</span><span><b data-t="m2Title"></b><span data-t="m2Sub"></span></span></div>
      <div class="grow"><span class="n">3</span><span><b data-t="m3Title"></b><span data-t="m3Sub"></span></span></div>

  <!-- MYTHS -->

      <span class="stamp m" id="stM"></span><span class="stamp f" id="stF"></span>
      <div class="qt" id="qtext"></div>
    </div>
    <div class="streak" id="streak"></div>

      <button class="m" id="aM"><span data-t="myth"></span><small data-t="mythSub"></small></button>

  <!-- SIGNS -->
  <section class="screen" id="s-signs">

    <button class="btn ghost sm mt8" id="sNone" data-t="nothingWrong"></button>
    <div class="reveal" id="srev">
      <div class="v" id="sv"></div><p id="se"></p>
      <button class="btn mt" id="snext" data-t="next"></button>
    </div>
    <div class="disc" data-t="disclaimer"></div>
  </section>

  <!-- TRAINER -->
  <section class="screen" id="s-train">
    <h2 data-t="m3Title"></h2>
    <div class="alert mt8" id="whenBox"></div>
    <div class="card pad mt">
      <span class="chip" id="tchip"></span>
      <div class="photo" id="tphoto"></div>
      <h3 class="mt" id="th"></h3>
      <p id="tp"></p>
      <div class="dots" id="tdots"></div>

        <button class="btn sm" id="tnext" data-t="gotIt"></button>
      </div>
    </div>
    <div class="disc" data-t="disclaimer"></div>
  </section>

  <!-- TECHNIQUE + PATTERNS -->
  <section class="screen" id="s-tech">
    <h2 data-t="pickPattern"></h2>
    <div class="card pad mt8">
      <div class="photo"><picture><source srcset="img/pads.webp" type="image/webp"><img src="img/pads.jpg" alt=""></picture></div>
      <p class="muted mt8" id="techText"></p>
      <div class="photo mt8"><picture><source srcset="img/overlap.webp" type="image/webp"><img src="img/overlap.jpg" alt=""></picture></div>
    </div>
    <div class="patgrid" id="patgrid"></div>
    <div class="card pad mt" id="patBox" hidden><h3 id="patH"></h3><p id="patP"></p></div>
    <div class="alert mt" id="patEnd"></div>
    <button class="btn mt" id="techDone" data-t="continue"></button>
    <div class="disc" data-t="disclaimer"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="s-result">
    <div class="card pad center">
      <div class="muted" data-t="scoreLabel"></div>
      <div class="big" id="rBig">0/23</div>
      <h2 class="mt8" id="rT"></h2>
      <p class="muted" id="rM"></p>
      <div class="scores">
        <div class="sc"><b id="sc1">0</b><span data-t="mythsLabel"></span></div>
        <div class="sc"><b id="sc2">0</b><span data-t="signsLabel"></span></div>
        <div class="sc"><b id="sc3">0</b><span data-t="stepsLabel"></span></div>
      </div>
    </div>
    <button class="btn mt" id="toPledge">🩷 <span data-t="unlocked"></span></button>
    <button class="btn ghost sm mt8" id="again" data-t="playAgain"></button>
    <div class="disc" data-t="disclaimer"></div>
  </section>

  <!-- PLEDGE -->
  <section class="screen" id="s-pledge">
    <h2 data-t="pledgeTitle"></h2>
    <p class="muted" data-t="pledgeSub"></p>
    <input type="text" id="pname" maxlength="26" autocomplete="name">
    <button class="btn" id="pmake" data-t="makeCard"></button>
    <div class="mt" id="pout" hidden>
      <canvas id="pcanvas" width="1600" height="1131"></canvas>
      <button class="btn mt" id="pshare" data-t="shareWA"></button>
      <a class="btn ghost sm mt8" id="pdl" download="pink-wave-2026.png" data-t="download"></a>
    </div>
    <button class="docbar mt" id="toBroch">📄 <b data-t="brochureTitle"></b></button>
    <button class="docbar" id="toEvent">📍 <b data-t="eventTitle"></b></button>
    <button class="docbar" id="toVideos">▶️ <b data-t="watchAll"></b></button>
    <div class="disc" data-t="disclaimer"></div>
    <div class="foot"><span data-t="credit"></span><br>© drmithleshw</div>
  </section>

  <!-- BROCHURE -->
  <section class="screen" id="s-broch">
    <h2 data-t="brochureTitle"></h2>
    <p class="muted" data-t="brochureSub"></p>
    <div class="card pad mt8">
      <label data-t="fldName"></label><input type="text" id="bName" maxlength="40">
      <label data-t="fldCity"></label><input type="text" id="bCity" maxlength="40">
      <label data-t="fldRole"></label><select id="bRole"></select>

      <label class="pledgebox" for="bPledge">
        <input type="checkbox" id="bPledge">
        <span class="tick" aria-hidden="true"></span>
        <span class="ptxt" data-t="pledgeCheck"></span>
      </label>
      <div class="pthanks" id="bThanks" hidden data-t="pledgeThanks"></div>

      <button class="btn mt8" id="bEnBtn" data-t="getPdfEn"></button>
      <button class="btn ghost sm mt8" id="bHiBtn" data-t="getPdfHi"></button>
    </div>
    <div class="disc" data-t="disclaimer"></div>
  </section>

  <!-- EVENT -->
  <section class="screen" id="s-event">
    <h2 data-t="eventTitle"></h2>
    <div class="rows mt8" id="evRows"></div>
    <a class="btn mt" id="regBtn" href="#" data-t="register"></a>
    <button class="btn ghost sm mt8" id="inviteBtn" data-t="invite"></button>
    <div class="card pad mt" id="clinicBox"></div>
    <div class="foot"><span data-t="credit"></span><br>© drmithleshw</div>
  </section>

  <!-- VIDEOS -->
  <section class="screen" id="s-videos">
    <h2 data-t="videoChip"></h2>
    <div id="vidSeries" class="mt8"></div>
    <h3 class="mt"><span data-t="watchAll"></span></h3>
    <div id="vidFeature"></div>
    <div class="foot"><span data-t="credit"></span><br>© drmithleshw</div>
  </section>

</div>
